# Template (Azure Pipelines) - CI Java (steps)
# Actualizado a Java 17
# Añadido JaCoCo: mvn test genera jacoco.xml y se publica como artefacto
parameters:
  mavenImage: "maven:3.9-eclipse-temurin-17"

steps:
  - script: |
      docker run --rm \
        -v $(pwd):/app \
        -w /app \
        --user $(id -u):$(id -g) \
        -e MAVEN_OPTS="-Dmaven.repo.local=/app/.m2" \
        ${{ parameters.mavenImage }} \
        mvn -q -Dmaven.repo.local=/app/.m2 -DskipTests=true test
    displayName: "Lint (mvn compile sin tests)"

  - script: |
      # 1. Crear red Docker compartida
      docker network create selenium-net || true

      # 2. Levantar Selenium standalone Chrome como sidecar
      docker run -d --rm \
        --name selenium \
        --network selenium-net \
        -p 4444:4444 \
        selenium/standalone-chrome:latest

      # 3. Esperar a que Selenium esté listo
      sleep 5

      # 4. Correr los tests conectando Maven a la misma red
      docker run --rm \
        -v $(pwd):/app \
        -w /app \
        --network selenium-net \
        --user $(id -u):$(id -g) \
        -e MAVEN_OPTS="-Dmaven.repo.local=/app/.m2" \
        ${{ parameters.mavenImage }} \
        mvn -q -Dmaven.repo.local=/app/.m2 test

      # 5. Parar el contenedor Selenium
      docker stop selenium || true
      docker network rm selenium-net || true
    displayName: "Test (mvn test) + JaCoCo"

  - task: PublishPipelineArtifact@1
    displayName: "Publicar reporte JaCoCo"
    inputs:
      targetPath: "$(System.DefaultWorkingDirectory)/target/site/jacoco"
      artifact: "jacoco-report"
